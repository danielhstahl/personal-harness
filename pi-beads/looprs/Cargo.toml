[package]
name = "looprs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = { version= "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
pulldown-cmark = "0.13.4"
ratatui = { version="0.30.2", features = ["scrolling-regions"]}
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] } # pure-Rust regex
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
# ADR-0001: the Bash terminal state runs `bash -i` on a real pty. Moved from
# dev-dependencies to dependencies when looprs-553 landed. Its transitive `nix 0.28`
# trips a future-incompat lint inside nix's own build script; that is a dependency
# warning, not ours (see ADR-0001 "Costs / follow-ups").
portable-pty = "0.9.0"

[dev-dependencies]
# examples/spike_bash.rs (the ADR-0001 spike) uses portable-pty, which is now a
# regular dependency, so there is nothing left to declare here.

[lints.cargo]
unused_dependencies = "allow"
