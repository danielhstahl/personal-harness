name: looprs gate

# The Rust harness's warning gate (looprs-6ol): fmt, `clippy -D warnings`, tests.
# Everything happens in `pi-beads/looprs/scripts/check.sh`; this file only pins
# when it runs, so "passes locally" and "passes here" cannot diverge into two
# different statements about the same branch.
#
# Path-filtered on purpose: this repo also carries the older TS `loop` project (and
# its own test workflow), and those tests say nothing about this crate.

on:
  push:
    paths:
      - "pi-beads/looprs/**"
      - ".github/workflows/looprs-gate.yml"
  pull_request:
    paths:
      - "pi-beads/looprs/**"
      - ".github/workflows/looprs-gate.yml"

jobs:
  gate:
    name: fmt + clippy -D warnings + cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pi-beads/looprs
    steps:
      - uses: actions/checkout@v4

      - name: install rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./pi-beads/looprs

      - name: fmt, clippy -D warnings, tests
        run: ./scripts/check.sh
