on: push

jobs:
  run_looprs_tests:
    name: fmt + clippy -D warnings + cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./looprs
    steps:
      - uses: actions/checkout@v4

      - name: install rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./looprs

      - name: fmt, clippy -D warnings, tests
        run: ./scripts/check.sh
        
  run_docker_build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: build docker
        run: |
          docker -t test -f docker/Dockerfile .

  check_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: generate docs
        working-directory: looprs
        run: |
            ./scripts/docs.sh check
