on: push

jobs:
  run_pi_beads_tests:
    name: Run tests for pi-beads
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pi-beads/loop
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
      VITEST_SEGFAULT_RETRY: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.1.0"
      - name: install deps
        run: |
          npm ci
      - name: run tests
        run: npm run test -- --coverage .
